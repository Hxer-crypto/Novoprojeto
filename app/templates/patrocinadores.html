<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patrocinadores</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>

body{
    background:#f5f5f5;
}

.card{
    border-radius:15px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.logo{
    width:100%;
    height:220px;
    object-fit:cover;
}

.info{
    display:none;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

<a class="navbar-brand" href="/">⚽ Meu Time</a>

</nav>

<div class="container mt-5">

<h2 class="mb-4">🤝 Patrocinadores</h2>

<div class="row">

{% for patrocinador in patrocinadores %}

<div class="col-md-4 mb-4">

<div class="card shadow">

{% if patrocinador.imagem %}
<img src="{{ patrocinador.imagem.url }}" class="logo">
{% endif %}

<div class="card-body text-center">

<h4>{{ patrocinador.nome }}</h4>

<p>
<strong>Empresa:</strong>
{{ patrocinador.empresa }}
</p>

<button
class="btn btn-danger"
onclick="mostrarInfo('info{{ patrocinador.id }}')">

Ver Informações

</button>

<div
class="info mt-3"
id="info{{ patrocinador.id }}">

<p>
<strong>Telefone:</strong>
{{ patrocinador.telefone }}
</p>

</div>

</div>

</div>

</div>

{% empty %}

<div class="col-12">

<div class="alert alert-warning">

Nenhum patrocinador cadastrado.

</div>

</div>

{% endfor %}

</div>

</div>

<script>

function mostrarInfo(id){

let el = document.getElementById(id);

if(el.style.display==="block"){
    el.style.display="none";
}
else{
    el.style.display="block";
}

}

</script>

</body>
</html>
