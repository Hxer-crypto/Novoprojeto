<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escalações</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<style>
body{
    background:#f5f5f5;
}

.card{
    border-radius:15px;
}

.titular{
    color:green;
    font-weight:bold;
}

.reserva{
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <a class="navbar-brand" href="/">⚽ Meu Time</a>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">📋 Escalações</h2>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-striped">

                <thead class="thead-dark">
                    <tr>
                        <th>Partida</th>
                        <th>Jogador</th>
                        <th>Situação</th>
                    </tr>
                </thead>

                <tbody>

                {% for e in escalacoes %}

                    <tr>
                        <td>{{ e.partida }}</td>
                        <td>{{ e.jogador }}</td>

                        <td>
                            {% if e.titular %}
                                <span class="titular">Titular</span>
                            {% else %}
                                <span class="reserva">Reserva</span>
                            {% endif %}
                        </td>

                    </tr>

                {% empty %}

                    <tr>
                        <td colspan="3">
                            Nenhuma escalação cadastrada.
                        </td>
                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
